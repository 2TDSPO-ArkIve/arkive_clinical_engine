<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArkIve — Pipeline ao vivo</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1b1f24; --muted: #5d6673; --line: #dde1e6;
    --accent: #2563eb; --on-accent: #ffffff; --ok: #15803d; --warn: #b45309; --err: #b91c1c; --skip: #6b7480;
    --code: #f1f3f5; --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --card: #171b21; --ink: #e6e9ed; --muted: #9aa4b1; --line: #2a3038;
      --accent: #60a5fa; --on-accent: #0f1216; --ok: #4ade80; --warn: #fbbf24; --err: #f87171; --skip: #6b7480;
      --code: #0b0e12;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 20px 24px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap;
           gap: 16px; align-items: center; justify-content: space-between; }
  h1 { margin: 0; font-size: 1.4rem; }
  h1 small { display: block; font-size: .85rem; font-weight: 400; color: var(--muted); }
  form { display: flex; gap: 8px; }
  input { font: inherit; padding: 8px 12px; width: 160px; border: 1px solid var(--line); border-radius: 8px;
          background: var(--card); color: var(--ink); }
  button { font: inherit; font-weight: 600; padding: 8px 18px; border: 0; border-radius: 8px;
           background: var(--accent); color: var(--on-accent); cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  #relogio { font: 600 1.1rem var(--mono); color: var(--muted); min-width: 90px; text-align: right; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 24px; padding: 24px; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; padding: 16px; } }

  ol#etapas { list-style: none; margin: 0; padding: 0; position: relative; }
  ol#etapas::before { content: ""; position: absolute; left: 19px; top: 8px; bottom: 8px; width: 2px; background: var(--line); }
  .etapa { position: relative; padding-left: 56px; margin-bottom: 16px; }
  .marca { position: absolute; left: 4px; top: 14px; width: 32px; height: 32px; border-radius: 50%;
           display: grid; place-items: center; font: 700 .9rem var(--mono);
           background: var(--card); border: 2px solid var(--line); color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px;
          transition: border-color .3s; border-style: dashed; }
  .card h2 { margin: 0; font-size: 1.05rem; display: flex; justify-content: space-between; gap: 8px; }
  .card .t { font: 500 .85rem var(--mono); color: var(--muted); white-space: nowrap; }
  .card p.oque { margin: 2px 0 0; color: var(--muted); font-size: .92rem; }
  .card .corpo:empty { display: none; }
  .card .corpo { margin-top: 12px; }
  .ativa .card, .feita .card, .pulada .card, .falhou .card { border-style: solid; }
  .ativa .card { border-color: var(--accent); }
  .ativa .marca { border-color: var(--accent); color: var(--accent); animation: pulso 1.2s infinite; }
  .feita .marca { background: var(--ok); border-color: var(--ok); color: var(--card); }
  .pulada .marca { background: var(--skip); border-color: var(--skip); color: #fff; }
  .falhou .card { border-color: var(--err); }
  .falhou .marca { background: var(--err); border-color: var(--err); color: var(--card); }
  @keyframes pulso { 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--accent) 25%, transparent); } }
  @media (prefers-reduced-motion: reduce) { .ativa .marca { animation: none; } }

  dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; font-size: .95rem; }
  dl.kv dt { color: var(--muted); }
  dl.kv dd { margin: 0; overflow-wrap: anywhere; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .chips li { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: .9rem; }
  .chips b { font-family: var(--mono); color: var(--accent); margin-left: 6px; }
  .badge { display: inline-block; padding: 1px 10px; border-radius: 999px; font-weight: 600; font-size: .85rem;
           border: 1px solid currentColor; }
  .barra { position: relative; height: 22px; background: var(--code); border-radius: 6px; margin: 6px 0 4px; }
  .barra .valor { height: 100%; border-radius: 6px; background: var(--accent); transition: width .8s; }
  .barra .limiar { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--warn); }
  .legenda { font-size: .85rem; color: var(--muted); }
  details { margin-top: 10px; }
  summary { cursor: pointer; color: var(--accent); font-size: .9rem; }
  pre { background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
        font: .8rem/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 420px; overflow: auto; }

  #resultado { display: none; }
  #resultado.mostrar { display: block; }
  .diag { font-size: 1.3rem; font-weight: 700; margin: 4px 0 8px; }
  .insight h3 { margin: 14px 0 2px; font-size: .95rem; color: var(--muted); }
  .insight p { margin: 0; }

  aside { position: sticky; top: 16px; align-self: start; }
  aside h2 { font-size: 1rem; margin: 0 0 8px; }
  #log { background: var(--code); border: 1px solid var(--line); border-radius: 12px; padding: 10px;
         height: calc(100vh - 160px); min-height: 300px; overflow: auto; font: .78rem/1.45 var(--mono); }
  @media (max-width: 1000px) { aside { position: static; } #log { height: 360px; } }
  #log div { padding: 2px 0; border-bottom: 1px dashed var(--line); overflow-wrap: anywhere; }
  #log .t { color: var(--muted); margin-right: 6px; }
  #log .WARNING { color: var(--warn); }
  #log .ERROR { color: var(--err); }
</style>
</head>
<body>
<header>
  <h1>ArkIve — Motor de Inteligência Clínica <small>Pipeline ao vivo: o que acontece com um ID de consulta, etapa por etapa</small></h1>
  <form id="form">
    <label for="id" class="legenda" style="align-self:center">ID_CONSULTA</label>
    <input id="id" type="number" min="1" required placeholder="ex.: 42">
    <button id="btn">Analisar</button>
    <span id="relogio">0,0 s</span>
  </form>
</header>
<main>
  <section>
    <ol id="etapas"></ol>
    <div id="resultado" class="card" style="border-style:solid"></div>
  </section>
  <aside>
    <h2>Log do motor em tempo real</h2>
    <div id="log" aria-live="polite"></div>
  </aside>
</main>

<script>
const ETAPAS = [
  ["oracle", "Banco Oracle (somente leitura)",
   "Busca animal, espécie, raça, consulta, bem-estar, histórico, prescrições, vacinas e relatos dos responsáveis."],
  ["confianca", "Confiança determinística",
   "Rubrica fixa de 0 a 100 calculada pelo sistema a partir da completude dos dados. O LLM não decide esse número."],
  ["predisposicoes", "Ranking de predisposições",
   "Doenças com predisposição para a espécie/raça, ordenadas por similaridade semântica (e5) com o relato. Só o top-N vai ao LLM."],
  ["resumo", "Resumo clínico estruturado",
   "Todos os dados do Oracle viram um texto organizado, que é a base do prompt."],
  ["rag", "RAG — base de conhecimento local",
   "O relato é transformado em vetor e comparado com trechos de livros veterinários indexados no FAISS."],
  ["decisao_web", "Decisão de busca externa",
   "Se a confiança ficar abaixo do limiar, o motor busca literatura externa para complementar."],
  ["busca_web", "Busca em literatura (PubMed / fontes confiáveis)",
   "PubMed primeiro, com termo em inglês derivado do RAG. Só domínios veterinários confiáveis são aceitos."],
  ["prompt", "Montagem do prompt",
   "Instruções do sistema + resumo clínico + confiança obrigatória + RAG + literatura, exatamente como enviado."],
  ["groq", "LLM (Groq)",
   "Modelo gera o diagnóstico em JSON validado por schema. Em falha, tenta de novo ou passa ao próximo modelo."],
  ["resultado", "Resposta da API",
   "JSON final devolvido ao serviço Java, que grava em TB_ARKIVE_DIAGNOSTICO."],
];

const $ = (s, el = document) => el.querySelector(s);
const el = (tag, attrs = {}, ...filhos) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "class" ? e.className = v : e.setAttribute(k, v);
  for (const f of filhos) if (f != null) e.append(f instanceof Node ? f : String(f));
  return e;
};
const seg = ms => (ms / 1000).toFixed(1).replace(".", ",") + " s";
const kv = pares => {
  const dl = el("dl", { class: "kv" });
  for (const [k, v] of pares) if (v !== undefined && v !== null && v !== "") dl.append(el("dt", {}, k), el("dd", {}, v));
  return dl;
};
const bruto = (titulo, conteudo) => el("details", {}, el("summary", {}, titulo),
  el("pre", {}, typeof conteudo === "string" ? conteudo : JSON.stringify(conteudo, null, 2)));
const chips = itens => { const ul = el("ul", { class: "chips" }); itens.forEach(i => ul.append(i)); return ul; };
const barra = (valor, limiar) => {
  const b = el("div", { class: "barra", role: "img", "aria-label": `${valor}% (limiar ${limiar}%)` });
  const v = el("div", { class: "valor" }); v.style.width = "0%";
  const l = el("div", { class: "limiar" }); l.style.left = limiar + "%";
  b.append(v, l); requestAnimationFrame(() => v.style.width = valor + "%");
  return b;
};

const RENDER = {
  oracle: ({ contexto: c }) => [
    kv([["Animal", `${c.nm_animal} (${c.ds_sexo || "?"}, castrado: ${c.ds_castrado || "?"})`],
        ["Espécie / raça", `${c.nm_especie} / ${c.nm_raca || "SRD"} ${c.tp_porte ? "· " + c.tp_porte : ""}`],
        ["Motivo", c.ds_motivo], ["Sintomas", c.ds_sintomas],
        ["Peso", c.kg_peso_consulta ?? c.kg_peso_bem_estar], ["Bem-estar",
          [c.ds_apetite, c.ds_atividade, c.ds_comportamento].filter(Boolean).join(" · ")],
        ["Registros", `${c.predisposicoes.length} predisposições · ${c.diagnosticos_anteriores.length} diagnósticos anteriores · ` +
          `${c.prescricoes.length} prescrições · ${c.eventos_preventivos.length} preventivos · ${c.relatos_responsaveis.length} relatos`]]),
    bruto("Ver todos os dados extraídos", c),
  ],
  confianca: d => [
    barra(d.pc_confianca, d.limiar),
    el("div", { class: "legenda" }, `${d.pc_confianca}% · linha laranja = limiar de busca externa (${d.limiar}%)`),
  ],
  predisposicoes: d => [
    el("p", { class: "legenda" }, `${d.selecionadas.length} de ${d.total} enviadas ao LLM · método: ${d.metodo} · ${d.ms} ms`),
    chips(d.selecionadas.map((p, i) => el("li", {}, p.nm_doenca || "?", d.scores ? el("b", {}, d.scores[i].toFixed(3)) : null))),
    bruto("Ver predisposições selecionadas", d.selecionadas),
  ],
  resumo: d => [el("p", { class: "legenda" }, `${d.texto.length.toLocaleString("pt-BR")} caracteres`), bruto("Ver resumo clínico", d.texto)],
  rag: d => [
    kv([["Status", d.status], ["Parâmetros", `top_k=${d.top_k} · score mínimo=${d.min_score}`]]),
    d.documentos.length ? chips(d.documentos.map(x => el("li", {}, x.titulo || x.fonte || JSON.stringify(x),
      x.score != null ? el("b", {}, Number(x.score).toFixed(3)) : null))) : null,
    bruto("Ver consulta usada", d.consulta),
    d.contexto ? bruto("Ver trechos enviados ao LLM", d.contexto) : null,
  ],
  decisao_web: d => [
    el("span", { class: "badge", style: `color:var(${d.busca_web ? "--warn" : "--ok"})` },
      d.busca_web ? `Buscar: ${d.pc_confianca}% < ${d.limiar}%` : `Não buscar: ${d.pc_confianca}% ≥ ${d.limiar}%`),
    kv([["Observações", d.motivo], ["Query", d.query]]),
  ],
  busca_web: d => d.acionada ? [
    el("p", { class: "legenda" }, `${d.fontes.length} fonte(s) confiável(is)`),
    el("ul", {}, ...d.fontes.map(u => el("li", {}, el("a", { href: u, target: "_blank", rel: "noopener" }, u)))),
    d.contexto ? bruto("Ver texto recuperado", d.contexto) : null,
  ] : [el("p", { class: "legenda" }, "Não acionada: dados locais suficientes.")],
  prompt: d => [
    el("p", { class: "legenda" }, `${(d.system.length + d.human.length).toLocaleString("pt-BR")} caracteres · modelos na fila: ${d.modelos.join(" → ")}`),
    bruto("Ver instruções do sistema", d.system),
    bruto("Ver mensagem do usuário (dados do caso)", d.human),
  ],
  groq: d => [
    kv([["Modelo", d.modelo], ["Tentativa", d.tentativa],
        ["Tokens", `${d.tokens.entrada} entrada + ${d.tokens.saida} saída = ${d.tokens.total}`]]),
    bruto("Ver JSON gerado pelo modelo", d.saida),
  ],
  resultado: d => [bruto("Ver JSON de resposta da API", d)],
};

const SEV = { BAIXA: "--ok", LEVE: "--ok", MODERADA: "--warn", MEDIA: "--warn", ALTA: "--err", GRAVE: "--err", CRITICA: "--err" };
function mostrarResultado(d) {
  const r = $("#resultado");
  r.replaceChildren(
    el("p", { class: "legenda" }, "Diagnóstico"),
    el("div", { class: "diag" }, d.ds_diagnostico),
    el("span", { class: "badge", style: `color:var(${SEV[(d.tp_severidade || "").toUpperCase()] || "--muted"})` }, `Severidade: ${d.tp_severidade}`),
    " ", el("span", { class: "badge" }, `Confiança: ${d.pc_confianca}%`),
    ...[["Perfil do paciente", d.insight_perfil], ["Correlação clínica", d.insight_correlacao],
        ["Predisposições", d.insight_predisposicao], ["Limitações", d.insight_limitacoes]]
      .map(([t, txt]) => el("div", { class: "insight" }, el("h3", {}, t), el("p", {}, txt))),
    d.fontes_rag.length ? el("div", { class: "insight" }, el("h3", {}, "Fontes (base local)"),
      el("p", {}, d.fontes_rag.map(f => f.titulo || f.fonte).join(" · "))) : null,
    d.fontes_pesquisadas.length ? el("div", { class: "insight" }, el("h3", {}, "Fontes pesquisadas"),
      el("ul", {}, ...d.fontes_pesquisadas.map(u => el("li", {}, u)))) : null,
  );
  r.classList.add("mostrar");
}

let fonte, timer, ativa, ultimoT = 0;
function montar() {
  $("#etapas").replaceChildren(...ETAPAS.map(([k, titulo, oque], i) => el("li", { class: "etapa", id: "e-" + k },
    el("span", { class: "marca" }, i + 1),
    el("div", { class: "card" }, el("h2", {}, titulo, el("span", { class: "t" })), el("p", { class: "oque" }, oque), el("div", { class: "corpo" })))));
  $("#resultado").classList.remove("mostrar");
  $("#log").replaceChildren();
}
function ativar(k) {
  ativa = k;
  const li = $("#e-" + k);
  if (li && !li.className.match(/feita|pulada|falhou/)) li.classList.add("ativa");
}
function concluir(k, dados, t) {
  const li = $("#e-" + k);
  li.classList.remove("ativa");
  li.classList.add(k === "busca_web" && !dados.acionada ? "pulada" : "feita");
  $(".t", li).textContent = `+${seg(t - ultimoT)} · em ${seg(t)}`;
  ultimoT = t;
  $(".corpo", li).replaceChildren(...RENDER[k](dados).filter(Boolean));
  const prox = ETAPAS[ETAPAS.findIndex(e => e[0] === k) + 1];
  if (prox) ativar(prox[0]);
  li.scrollIntoView({ behavior: "smooth", block: "nearest" });
}
function log(t, d) {
  const box = $("#log");
  box.append(el("div", { class: d.nivel }, el("span", { class: "t" }, seg(t)), d.msg));
  box.scrollTop = box.scrollHeight;
}
function parar() { fonte?.close(); clearInterval(timer); $("#btn").disabled = false; }

$("#form").addEventListener("submit", ev => {
  ev.preventDefault();
  parar(); montar(); ultimoT = 0;
  const id = $("#id").value, t0 = performance.now();
  $("#btn").disabled = true;
  timer = setInterval(() => $("#relogio").textContent = seg(performance.now() - t0), 100);
  ativar("oracle");
  fonte = new EventSource(`pipeline/stream/${encodeURIComponent(id)}`);
  fonte.onmessage = ({ data }) => {
    const { etapa, t_ms, dados } = JSON.parse(data);
    if (etapa === "log") return log(t_ms, dados);
    if (etapa === "inicio") return;
    if (etapa === "erro") {
      const li = $("#e-" + ativa);
      li?.classList.replace("ativa", "falhou");
      li && $(".corpo", li).replaceChildren(el("p", { style: "color:var(--err)" }, `${dados.tipo}: ${dados.msg}`));
      return log(t_ms, { nivel: "ERROR", msg: `${dados.tipo}: ${dados.msg}` });
    }
    if (etapa === "fim") { $("#relogio").textContent = seg(t_ms); return parar(); }
    if (RENDER[etapa]) concluir(etapa, dados, t_ms);
    if (etapa === "resultado") mostrarResultado(dados);
  };
  fonte.onerror = () => { log(0, { nivel: "ERROR", msg: "Conexão com o stream perdida." }); parar(); };
});
montar();
</script>
</body>
</html>
