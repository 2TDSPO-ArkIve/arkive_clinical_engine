<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArkIve — Pipeline ao vivo</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..800&family=IBM+Plex+Mono:wght@400;600&display=swap" media="print" onload="this.media='all'"><!-- taste-skill-ignore: mono só em <pre> e no log -->
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..800&family=IBM+Plex+Mono:wght@400;600&display=swap"></noscript><!-- taste-skill-ignore: mono só em <pre> e no log (dados brutos) -->
<style>
  /* sem internet a Schibsted Grotesk não carrega e cai na fonte do sistema: mesmo layout */
  :root {
    /* paleta do app ArkIve (Mobile-Application/src/styles/colors.ts) */
    --bg: #f4f5f7; --surface: #e9ebf0; --surface-2: #dde2ea; --ink: #1f2937; --muted: #4b5563;
    --accent: #3f51b5; --on-accent: #ffffff; --ok: #2e7d32; --warn: #c25700; --err: #d32f2f; --skip: #6b7280;
    --ok-txt: #1b5e20; --warn-txt: #8a3d00; --err-txt: #b71c1c; --accent-txt: #3347a8; --on-marca: #ffffff;
    --selo: #3347a8; --selo-ok: #2e7d32; --selo-warn: #c25700; --selo-err: #d32f2f; --on-selo: #ffffff;
    --code: #e4e7ee; --campo: #1f2a5c; --on-campo: #eef0fb; --on-campo-muted: #b8c0ea;
    --sans: "Schibsted Grotesk", "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "Cascadia Code", Consolas, monospace; /* taste-skill-ignore: só <pre> e log */
    --ease: cubic-bezier(.32, .72, 0, 1);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141c; --surface: #1b1f2c; --surface-2: #2b3040; --ink: #e7eaf2; --muted: #a4adc0;
      --accent: #7c8ee8; --on-accent: #12141c; --ok: #66bb6a; --warn: #ffa654; --err: #ef5350; --skip: #7d8599;
      --ok-txt: #8fd693; --warn-txt: #ffb26b; --err-txt: #ff8a80; --accent-txt: #9aa8f0; --on-marca: #12141c;
      --code: #0e1017; --campo: #1d2340; --on-campo: #e7eaf2; --on-campo-muted: #a9b3e0;
    }
  }
  * { box-sizing: border-box; }
  ::selection { background: var(--accent); color: var(--on-accent); }
  html { scrollbar-color: var(--surface-2) var(--bg); }
  body { margin: 0; background: var(--bg); color: var(--ink); caret-color: var(--accent); accent-color: var(--accent);
         font: 1.0625rem/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  /* ── topo: o ID que atravessa o motor ── */
  header { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 32px 48px; align-items: end;
           padding: 40px 32px 48px; }
  .topo { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; margin-bottom: 24px; }
  .topo .nome { font-weight: 800; font-size: 1.25rem; letter-spacing: -.02em; color: var(--accent-txt);
                text-decoration: none; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; }
  .topo .nome i { width: 26px; height: 26px; background: currentColor;
                  -webkit-mask: url(/static/arkive-logo.png) center / contain no-repeat; mask: url(/static/arkive-logo.png) center / contain no-repeat; }
  .topo span:last-child { color: var(--muted); }
  h1 { margin: 0; font-size: clamp(2rem, 4vw, 2.75rem); line-height: 1.02; letter-spacing: -.035em; font-weight: 650;
       max-width: 16ch; text-wrap: balance; }
  .sub { margin: 12px 0 28px; color: var(--muted); max-width: 52ch; }
  form { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  label { font-weight: 600; }
  input { font: 600 1.25rem var(--sans); padding: 12px 18px; width: 180px; border: 0; border-radius: 999px;
          background: var(--surface); color: var(--ink); transition: background-color .3s var(--ease); }
  input:hover { background: var(--surface-2); }
  input::placeholder { color: var(--muted); font-weight: 400; }
  button { font: 600 1.0625rem var(--sans); display: inline-flex; align-items: center; gap: 14px;
           padding: 6px 6px 6px 24px; border: 0; border-radius: 999px; background: var(--accent); color: var(--on-accent);
           cursor: pointer; transition: transform .25s var(--ease); touch-action: manipulation; }
  button .seta { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
                 background: rgb(128 128 128 / .2); background: color-mix(in srgb, var(--on-accent) 18%, transparent); transition: transform .45s var(--ease); }
  button:not(:disabled):hover .seta { transform: translate(3px, -1px) scale(1.06); }
  button:active { transform: scale(.98); }
  button:disabled { cursor: progress; }
  button:disabled .seta svg { animation: gira 1s linear infinite; }

  .painel { text-align: right; }
  #id-grande { margin: 0; font-size: clamp(3rem, 8vw, 6rem); font-weight: 700; line-height: .9; letter-spacing: -.04em;
               overflow-wrap: anywhere; }
  #id-grande.vazio { color: var(--muted); }
  .linha-status { margin: 14px 0 0; color: var(--muted); }
  .linha-status b { color: var(--ink); }
  .rodando #relogio { animation: respira 1.6s var(--ease) infinite; }

  /* ── corpo ── */
  main { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 40px; padding: 0 32px 96px; }

  ol#etapas { list-style: none; margin: 0; padding: 0; position: relative; --p: 0; }
  ol#etapas::before, ol#etapas::after { content: ""; position: absolute; left: 16px; top: 20px; bottom: 20px; width: 4px;
                                        border-radius: 2px; background: var(--surface-2); }
  ol#etapas::after { background: var(--accent); transform-origin: top; transform: scaleY(var(--p));
                     transition: transform .6s var(--ease); }
  /* z-index: a animação de entrada cria stacking context na li; sem ele o trilho (::after) pinta sobre a marca */
  .etapa { position: relative; z-index: 1; padding-left: 60px; margin-bottom: 12px; }
  .marca { position: absolute; z-index: 1; left: 0; top: 16px; width: 36px; height: 36px; border-radius: 50%;
           display: grid; place-items: center; background: var(--surface-2); color: var(--on-marca); }
  .marca svg { width: 18px; height: 18px; }
  .card { background: var(--surface); border-radius: 18px; padding: 18px 22px; transition: background-color .5s var(--ease); }
  .card .cab { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .card h2 { margin: 0; font-size: 1.25rem; line-height: 1.25; letter-spacing: -.01em; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .card .t { font-size: .9375rem; font-weight: 500; color: var(--muted); white-space: nowrap; }
  .card p.oque { margin: 4px 0 0; color: var(--muted); max-width: 62ch; }
  .card .corpo:empty { display: none; }
  .card .corpo { margin-top: 16px; }
  .corpo p, .corpo li { max-width: 62ch; }

  /* primeiro background de cada par: fallback para navegador sem color-mix() (Chrome <111, Safari <16.2) */
  .ativa .card { background: var(--surface-2); background: color-mix(in srgb, var(--accent) 13%, var(--surface)); }
  .ativa .marca { background: var(--accent); }
  .ativa .marca::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--accent);
                         animation: onda 1.4s var(--ease) infinite; }
  .feita .marca { background: var(--ok); }
  .pulada .marca { background: var(--skip); }
  .falhou .card { background: var(--surface-2); background: color-mix(in srgb, var(--err) 13%, var(--surface)); }
  .falhou .marca { background: var(--err); }
  .feita .marca svg, .pulada .marca svg, .falhou .marca svg { animation: pop .5s var(--ease) both; }

  dl.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 18px; margin: 0; }
  dl.kv dt { color: var(--muted); }
  dl.kv dd { margin: 0; overflow-wrap: anywhere; max-width: 62ch; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .chips li { background: var(--surface); background: color-mix(in srgb, var(--accent) 10%, var(--bg)); border-radius: 999px; padding: 4px 14px;
              animation: sobe .5s var(--ease) both; animation-delay: calc(var(--i, 0) * 40ms); }
  .chips b { font-weight: 650; color: var(--accent-txt); margin-left: 8px; }
  .badge { display: inline-block; padding: 4px 14px; border-radius: 999px; font-weight: 600;
           background: rgb(128 128 128 / .14); background: color-mix(in srgb, currentColor 14%, transparent); }
  .barra { position: relative; height: 28px; background: var(--surface-2); border-radius: 8px; margin: 12px 0 14px; }
  .barra .valor { height: 100%; border-radius: 8px; background: var(--accent); transform-origin: left; transform: scaleX(0);
                  transition: transform 1s var(--ease); }
  /* passa da barra e tem folga na cor do card: continua visível sobre o preenchimento */
  .barra .limiar { position: absolute; top: -7px; bottom: -7px; width: 4px; margin-left: -2px; border-radius: 2px;
                   background: var(--warn); outline: 3px solid var(--surface); animation: aparece .4s var(--ease) .8s both; }
  .legenda { color: var(--muted); margin: 0 0 10px; max-width: 62ch; }
  .corpo > * { animation: sobe .55s var(--ease) both; }
  .corpo > :nth-child(2) { animation-delay: 70ms; } .corpo > :nth-child(3) { animation-delay: 140ms; }
  .corpo > :nth-child(n+4) { animation-delay: 210ms; }
  details { margin-top: 2px; }
  summary { cursor: pointer; color: var(--accent); font-weight: 600; width: fit-content; padding-block: 10px; }
  .corpo li a { display: inline-block; padding-block: 10px; }
  pre { background: var(--code); border-radius: 12px; padding: 14px 16px; margin: 10px 0 0;
        font: .8125rem/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 440px; overflow: auto; }
  a { color: var(--accent); text-underline-offset: 3px; }

  aside { position: sticky; top: 24px; align-self: start; }
  aside h2 { font-size: 1.25rem; letter-spacing: -.01em; margin: 0 0 12px; }
  #log { background: var(--code); border-radius: 18px; padding: 14px 16px; height: calc(100vh - 120px); min-height: 320px;
         overflow: auto; overscroll-behavior: contain; font: .8125rem/1.5 var(--mono); }
  #log:empty::before { content: "Os registros do motor aparecem aqui assim que a análise começa."; font-family: var(--sans);
                       color: var(--muted); font-size: 1rem; }
  #log code { display: block; font: inherit; padding: 3px 0; overflow-wrap: anywhere; animation: desliza .35s var(--ease) both; }
  #log .t { color: var(--muted); margin-right: 8px; }
  #log .WARNING { color: var(--warn-txt); }
  #log .ERROR { color: var(--err-txt); }
  .msg-erro { color: var(--err-txt); font-weight: 600; }

  /* ── resultado: campo inteiro de cor ── */
  #resultado { display: none; background: var(--campo); color: var(--on-campo); padding: 72px 32px 96px; }
  #resultado.mostrar { display: block; }
  #resultado .rotulo { margin: 0 0 8px; font-size: 1.0625rem; color: var(--on-campo-muted); font-weight: 600; }
  .diag { margin: 0 0 24px; font-size: clamp(1.9rem, 4vw, 2.75rem); line-height: 1.08; letter-spacing: -.03em;
          font-weight: 650; max-width: 28ch; text-wrap: balance; }
  .selos { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 48px; }
  .selo { padding: 8px 18px; border-radius: 999px; font-weight: 600; background: var(--selo); color: var(--on-selo); }
  .selo.ok { background: var(--selo-ok); } .selo.warn { background: var(--selo-warn); } .selo.err { background: var(--selo-err); }
  .insights { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 32px 56px; max-width: 1200px; }
  .insight h3 { margin: 0 0 6px; font-size: 1.0625rem; color: var(--on-campo-muted); }
  .insight p, .insight ul { margin: 0; max-width: 65ch; }
  .insight ul { padding-left: 1.2em; overflow-wrap: anywhere; }
  #resultado.mostrar .diag, #resultado.mostrar .selos, #resultado.mostrar .insight { animation: sobe .7s var(--ease) both; }
  #resultado.mostrar .selos { animation-delay: 120ms; }
  #resultado.mostrar .insight { animation-delay: calc(240ms + var(--i, 0) * 80ms); }

  .entra { animation: sobe .6s var(--ease) both; animation-delay: calc(var(--i, 0) * 70ms); }

  @keyframes sobe { from { opacity: 0; transform: translateY(20px); } }
  @keyframes desliza { from { opacity: 0; transform: translateX(-8px); } }
  @keyframes aparece { from { opacity: 0; } }
  @keyframes pop { from { opacity: 0; transform: scale(.4); } }
  @keyframes onda { from { opacity: .45; transform: scale(1); } to { opacity: 0; transform: scale(1.9); } }
  @keyframes respira { 50% { opacity: .55; } }
  @keyframes gira { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    @keyframes sobe { from { opacity: 0; } }
    @keyframes desliza { from { opacity: 0; } }
    @keyframes pop { from { opacity: 0; } }
    ol#etapas::after, .barra .valor, button, button .seta { transition: none; }
    button:not(:disabled):hover .seta, button:active { transform: none; }
    .ativa .marca::after { display: none; }
    .ativa .marca { outline: 3px solid var(--accent); outline-offset: 3px; }
    button:disabled .seta svg { animation: respira 1.6s ease-out infinite; }
  }

  @media (max-width: 1000px) {
    main { grid-template-columns: minmax(0, 1fr); }
    aside { position: static; }
    #log { height: 360px; }
  }
  @media (max-width: 700px) {
    header { grid-template-columns: minmax(0, 1fr); padding: 28px 16px 36px; }
    .painel { text-align: left; }
    main { padding: 0 16px 64px; gap: 32px; }
    .etapa { padding-left: 48px; }
    .card { padding: 16px; }
    .card .cab { flex-direction: column; gap: 2px; }
    dl.kv { grid-template-columns: minmax(0, 1fr); gap: 0; }
    dl.kv dd { margin-bottom: 8px; }
    #resultado { padding: 48px 16px 64px; }
    label { flex-basis: 100%; }
    input { flex: 1 1 140px; width: auto; }
  }
</style>
</head>
<body>
<header>
  <p class="topo"><a class="nome" href="/"><i aria-hidden="true"></i>ArkIve</a><span>Motor de Inteligência Clínica · pipeline ao vivo</span></p>
  <div>
    <h1>Uma consulta, etapa por etapa</h1>
    <p class="sub">Digite o ID de uma consulta e acompanhe, em tempo real, os dados reais que passam por cada etapa até o diagnóstico.</p>
    <form id="form">
      <label for="id">ID da consulta</label>
      <input id="id" name="id" type="number" min="1" required inputmode="numeric" autocomplete="off" placeholder="ex.: 42…">
      <button id="btn"><span id="btn-txt">Analisar</span><span class="seta" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button>
    </form>
  </div>
  <div class="painel">
    <p id="id-grande" class="vazio">#—</p>
    <p class="linha-status"><span id="status" role="status"><b id="contagem">0 de 10 etapas</b><span id="etapa-atual"></span></span> · <span id="relogio">0,0 s</span></p>
  </div>
</header>
<main>
  <section aria-label="Etapas do pipeline">
    <ol id="etapas"></ol>
  </section>
  <aside>
    <h2>Log do motor</h2>
    <div id="log" role="region" tabindex="0" aria-label="Log do motor"></div>
  </aside>
</main>
<section id="resultado" aria-label="Resposta da API"></section>

<script>
const ETAPAS = [
  ["oracle", "Banco Oracle (somente leitura)",
   "Busca animal, espécie, raça, consulta, bem-estar, histórico, prescrições, vacinas e relatos dos responsáveis."],
  ["confianca", "Confiança determinística",
   "Rubrica fixa de 0 a 100 calculada pelo sistema a partir da completude dos dados. O LLM não decide esse número."],
  ["predisposicoes", "Ranking de predisposições",
   "Doenças com predisposição para a espécie/raça, ordenadas por similaridade semântica (e5) com o relato. Só o top-N vai ao LLM."],
  ["resumo", "Resumo clínico estruturado",
   "Todos os dados do Oracle viram um texto organizado, que é a base do prompt."],
  ["rag", "RAG — base de conhecimento local",
   "O relato é transformado em vetor e comparado com trechos de livros veterinários indexados no FAISS."],
  ["decisao_web", "Decisão de busca externa",
   "Se a confiança ficar abaixo do limiar, o motor busca literatura externa para complementar."],
  ["busca_web", "Busca em literatura (PubMed / fontes confiáveis)",
   "PubMed primeiro, com termo em inglês derivado do RAG. Só domínios veterinários confiáveis são aceitos."],
  ["prompt", "Montagem do prompt",
   "Instruções do sistema + resumo clínico + confiança obrigatória + RAG + literatura, exatamente como enviado."],
  ["groq", "LLM (Groq)",
   "Modelo gera o diagnóstico em JSON validado por schema. Em falha, tenta de novo ou passa ao próximo modelo."],
  ["resultado", "Resposta da API",
   "JSON final devolvido ao serviço Java, que grava em TB_ARKIVE_DIAGNOSTICO."],
];

const ESTADO_TXT = { ativa: "em andamento", feita: "concluída", pulada: "pulada", falhou: "falhou" };
const ICONE = {
  feita: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  pulada: '<path d="M6 12h12"/>',
  falhou: '<path d="M7 7l10 10M17 7L7 17"/>',
};

const $ = (s, el = document) => el.querySelector(s);
const el = (tag, attrs = {}, ...filhos) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "class" ? e.className = v : e.setAttribute(k, v);
  for (const f of filhos) if (f != null) e.append(f instanceof Node ? f : String(f));
  return e;
};
const NUM = new Intl.NumberFormat("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const seg = ms => NUM.format(ms / 1000) + " s";
// números no padrão pt-BR (34,2 · 0,871 · 5.210); o Oracle manda Decimal como string
const num = (v, casas) => v == null || v === "" ? v : Number(v).toLocaleString("pt-BR", casas == null ? {} : { minimumFractionDigits: casas, maximumFractionDigits: casas });
// espaço não separável: o número não fica sozinho no fim da linha
const qtd = (n, um, varios) => `${n}\u00a0${n === 1 ? um : varios}`;
const kv = pares => {
  const dl = el("dl", { class: "kv" });
  for (const [k, v] of pares) if (v !== undefined && v !== null && v !== "") dl.append(el("dt", {}, k), el("dd", {}, v));
  return dl;
};
const bruto = (titulo, conteudo) => el("details", {}, el("summary", {}, titulo),
  el("pre", { translate: "no", tabindex: "0" }, typeof conteudo === "string" ? conteudo : JSON.stringify(conteudo, null, 2)));
const chips = itens => { const ul = el("ul", { class: "chips" }); itens.forEach((li, i) => { li.style.setProperty("--i", i); ul.append(li); }); return ul; };
const barra = (valor, limiar) => {
  const b = el("div", { class: "barra", role: "img", "aria-label": `${valor}% (limiar ${limiar}%)` });
  const v = el("div", { class: "valor" });
  const l = el("div", { class: "limiar" }); l.style.left = limiar + "%";
  b.append(v, l); requestAnimationFrame(() => requestAnimationFrame(() => v.style.transform = `scaleX(${valor / 100})`));
  return b;
};

const RENDER = {
  oracle: ({ contexto: c }) => [
    kv([["Animal", `${c.nm_animal} (${c.ds_sexo || "?"}, castrado: ${c.ds_castrado || "?"})`],
        ["Espécie / raça", `${c.nm_especie} / ${c.nm_raca || "SRD"} ${c.tp_porte ? "· " + c.tp_porte : ""}`],
        ["Motivo", c.ds_motivo], ["Sintomas", c.ds_sintomas],
        ["Peso", (p => p == null ? p : num(p) + " kg")(c.kg_peso_consulta ?? c.kg_peso_bem_estar)], ["Bem-estar",
          [c.ds_apetite, c.ds_atividade, c.ds_comportamento].filter(Boolean).join(" · ")],
        ["Registros", [qtd(c.predisposicoes.length, "predisposição", "predisposições"),
          qtd(c.diagnosticos_anteriores.length, "diagnóstico anterior", "diagnósticos anteriores"),
          qtd(c.prescricoes.length, "prescrição", "prescrições"), qtd(c.eventos_preventivos.length, "preventivo", "preventivos"),
          qtd(c.relatos_responsaveis.length, "relato", "relatos")].join(" · ")]]),
    bruto("Ver todos os dados extraídos", c),
  ],
  confianca: d => [
    barra(d.pc_confianca, d.limiar),
    el("p", { class: "legenda" }, `${d.pc_confianca}% · marca vertical = limiar de busca externa (${d.limiar}%)`),
  ],
  predisposicoes: d => [
    el("p", { class: "legenda" }, `${d.selecionadas.length} de ${d.total} enviadas ao LLM · método: ${d.metodo} · ${d.ms} ms`),
    chips(d.selecionadas.map((p, i) => el("li", {}, p.nm_doenca || "?", d.scores ? el("b", {}, num(d.scores[i], 3)) : null))),
    bruto("Ver predisposições selecionadas", d.selecionadas),
  ],
  resumo: d => [el("p", { class: "legenda" }, `${d.texto.length.toLocaleString("pt-BR")} caracteres`), bruto("Ver resumo clínico", d.texto)],
  rag: d => [
    kv([["Status", d.status], ["Parâmetros", `top_k=${d.top_k} · score mínimo=${d.min_score}`]]),
    d.documentos.length ? chips(d.documentos.map(x => el("li", {}, x.titulo || x.fonte || JSON.stringify(x),
      x.score != null ? el("b", {}, num(x.score, 3)) : null))) : null,
    bruto("Ver consulta usada", d.consulta),
    d.contexto ? bruto("Ver trechos enviados ao LLM", d.contexto) : null,
  ],
  decisao_web: d => [
    el("p", {}, el("span", { class: "badge", style: `color:var(${d.busca_web ? "--warn-txt" : "--ok-txt"})` },
      d.busca_web ? `Buscar: ${d.pc_confianca}% < ${d.limiar}%` : `Não buscar: ${d.pc_confianca}% ≥ ${d.limiar}%`)),
    kv([["Observações", d.motivo], ["Query", d.query]]),
  ],
  busca_web: d => d.acionada ? [
    el("p", { class: "legenda" }, qtd(d.fontes.length, "fonte confiável", "fontes confiáveis")),
    el("ul", {}, ...d.fontes.map(u => el("li", {}, el("a", { href: u, target: "_blank", rel: "noopener" }, u)))),
    d.contexto ? bruto("Ver texto recuperado", d.contexto) : null,
  ] : [el("p", { class: "legenda" }, "Não acionada: dados locais suficientes.")],
  prompt: d => [
    el("p", { class: "legenda" }, `${(d.system.length + d.human.length).toLocaleString("pt-BR")} caracteres · modelos na fila: `,
      el("span", { translate: "no" }, d.modelos.join(" → "))),
    bruto("Ver instruções do sistema", d.system),
    bruto("Ver mensagem do usuário (dados do caso)", d.human),
  ],
  groq: d => [
    kv([["Modelo", el("span", { translate: "no" }, d.modelo)], ["Tentativa", d.tentativa],
        ["Tokens", `${num(d.tokens.entrada)} entrada + ${num(d.tokens.saida)} saída = ${num(d.tokens.total)}`]]),
    bruto("Ver JSON gerado pelo modelo", d.saida),
  ],
  resultado: d => [bruto("Ver JSON de resposta da API", d)],
};

const SEV = { AUSENTE: "ok", BAIXA: "ok", LEVE: "ok", MODERADA: "warn", MEDIA: "warn", ALTA: "err", GRAVE: "err", CRITICA: "err" };
function mostrarResultado(d) {
  const insights = [["Perfil do paciente", d.insight_perfil], ["Correlação clínica", d.insight_correlacao],
                    ["Predisposições", d.insight_predisposicao], ["Limitações", d.insight_limitacoes]]
    .map(([t, txt]) => el("div", { class: "insight" }, el("h3", {}, t), el("p", {}, txt)));
  if (d.fontes_rag.length) insights.push(el("div", { class: "insight" }, el("h3", {}, "Fontes (base local)"),
    el("p", {}, d.fontes_rag.map(f => f.titulo || f.fonte).join(" · "))));
  if (d.fontes_pesquisadas.length) insights.push(el("div", { class: "insight" }, el("h3", {}, "Fontes pesquisadas"),
    el("ul", {}, ...d.fontes_pesquisadas.map(u => el("li", {}, u)))));
  insights.forEach((n, i) => n.style.setProperty("--i", i));

  const r = $("#resultado");
  r.replaceChildren(
    el("h2", { class: "rotulo" }, `Diagnóstico da consulta #${idAtual}`),
    el("p", { class: "diag" }, d.ds_diagnostico),
    el("div", { class: "selos" },
      el("span", { class: `selo ${SEV[(d.tp_severidade || "").toUpperCase()] || ""}` }, `Severidade: ${d.tp_severidade}`),
      el("span", { class: "selo" }, `Confiança: ${d.pc_confianca}%`)),
    el("div", { class: "insights" }, ...insights),
  );
  r.classList.add("mostrar");
}

let fonte, timer, ativa, idAtual, ultimoT = 0;
function estado(li, cls) {
  li.classList.remove("ativa");
  li.classList.add(cls);
  $(".sr", li).textContent = ", " + ESTADO_TXT[cls];
  $(".marca", li).innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${ICONE[cls]}</svg>`;
  progresso();
}
function progresso() {
  // etapa que falhou não avança o trilho nem a contagem
  const n = document.querySelectorAll(".feita, .pulada").length;
  $("#etapas").style.setProperty("--p", n / ETAPAS.length);
  $("#contagem").textContent = `${n} de ${ETAPAS.length} etapas`;
}
function montar() {
  $("#etapas").replaceChildren(...ETAPAS.map(([k, titulo, oque], i) => {
    const li = el("li", { class: "etapa entra", id: "e-" + k },
      el("span", { class: "marca", "aria-hidden": "true" }),
      el("div", { class: "card" },
        el("div", { class: "cab" }, el("h2", {}, titulo, el("span", { class: "sr" }, ", pendente")), el("span", { class: "t" })),
        el("p", { class: "oque" }, oque), el("div", { class: "corpo" })));
    li.style.setProperty("--i", i);
    return li;
  }));
  $("#resultado").classList.remove("mostrar");
  $("#log").replaceChildren();
  $("#etapa-atual").textContent = "";
  progresso();
}
const TITULO = Object.fromEntries(ETAPAS.map(([k, t]) => [k, t]));
function ativar(k) {
  ativa = k;
  const li = $("#e-" + k);
  if (li && !li.className.match(/feita|pulada|falhou/)) { li.classList.add("ativa"); $(".sr", li).textContent = ", " + ESTADO_TXT.ativa; }
  $("#etapa-atual").textContent = ` · agora: ${TITULO[k]}`;
}
function concluir(k, dados, t) {
  const li = $("#e-" + k);
  estado(li, k === "busca_web" && !dados.acionada ? "pulada" : "feita");
  $(".t", li).textContent = `+${seg(t - ultimoT)} · em ${seg(t)}`;
  ultimoT = t;
  $(".corpo", li).replaceChildren(...RENDER[k](dados).filter(Boolean));
  const prox = ETAPAS[ETAPAS.findIndex(e => e[0] === k) + 1];
  if (prox) ativar(prox[0]);
  li.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "nearest" });
}
function log(t, d) {
  const box = $("#log");
  box.append(el("code", { class: d.nivel }, el("span", { class: "t" }, seg(t)), d.msg));
  box.scrollTop = box.scrollHeight;
}
function falhar(tipo, msg, t) {
  const li = $("#e-" + ativa);
  if (li && li.classList.contains("ativa")) {
    estado(li, "falhou");
    $(".corpo", li).replaceChildren(el("p", { class: "msg-erro" }, `${tipo}: ${msg}`));
    $("#etapa-atual").textContent = ` · falhou em: ${TITULO[ativa]}`;
  }
  log(t, { nivel: "ERROR", msg: `${tipo}: ${msg}` });
}
function parar() {
  fonte?.close(); clearInterval(timer);
  document.body.classList.remove("rodando");
  $("#btn").disabled = false; $("#btn-txt").textContent = "Analisar";
}

$("#form").addEventListener("submit", ev => {
  ev.preventDefault();
  parar(); montar(); ultimoT = 0;
  const id = idAtual = $("#id").value, t0 = performance.now();
  history.replaceState(null, "", `?id=${encodeURIComponent(id)}`);
  $("#id-grande").textContent = "#" + id; $("#id-grande").classList.remove("vazio");
  $("#btn").disabled = true; $("#btn-txt").textContent = "Analisando…";
  document.body.classList.add("rodando");
  timer = setInterval(() => $("#relogio").textContent = seg(performance.now() - t0), 100);
  ativar("oracle");
  fonte = new EventSource(`pipeline/stream/${encodeURIComponent(id)}`);
  fonte.onmessage = ({ data }) => {
    const { etapa, t_ms, dados } = JSON.parse(data);
    if (etapa === "log") return log(t_ms, dados);
    if (etapa === "inicio") return;
    if (etapa === "erro") return falhar(dados.tipo, dados.msg, t_ms);
    if (etapa === "fim") { $("#relogio").textContent = seg(t_ms); return parar(); }
    if (RENDER[etapa]) concluir(etapa, dados, t_ms);
    if (etapa === "resultado") { mostrarResultado(dados); $("#etapa-atual").textContent = " · concluído"; }
  };
  fonte.onerror = () => {
    falhar("Sem conexão com a API", "o servidor não respondeu ou fechou a conexão. No plano gratuito do Render, " +
           "a primeira chamada leva cerca de 1 min para acordar o servidor: aguarde e clique em Analisar de novo.", performance.now() - t0);
    parar();
  };
});

montar();
const idUrl = new URLSearchParams(location.search).get("id");
// requestSubmit não existe no Safari <16: sem o fallback, o link "Abrir a consulta N" da home não dispara nada
if (/^\d+$/.test(idUrl)) { const f = $("#form"); $("#id").value = idUrl; f.requestSubmit ? f.requestSubmit() : f.dispatchEvent(new Event("submit", { cancelable: true })); }
</script>
</body>
